[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaagaz"
version = "0.1.0"
description = "Local, offline document assistant for Indian forms (Gemma 4 via Ollama)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.3",
  "pillow-heif>=0.16",
  "pymupdf>=1.24",
  "opencv-python-headless>=4.9",
  "pydantic>=2.7",
  "typer>=0.12",
  "ollama>=0.3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8"]

[project.scripts]
kaagaz = "kaagaz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kaagaz"]